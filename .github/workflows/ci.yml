name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Ruleset is in sync with domains.txt
        run: |
          python3 tools/build_rules.py
          git diff --exit-code extension/rules/ads.json
      - name: Unit + consistency tests
        run: npm test
      - name: Server script lint
        run: |
          sudo apt-get install -y shellcheck
          shellcheck -S warning server/install.sh
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: End-to-end test in real Chrome
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: xvfb-run -a npm run e2e

  package:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: aenv-shield-extension
          path: dist/*.zip
      - name: GitHub Release for the manifest version (once per version)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./extension/manifest.json').version")
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "Release v$V already exists"
          else
            gh release create "v$V" dist/*.zip --target "$GITHUB_SHA" --title "AENV Shield $V" --generate-notes
          fi
