<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AENV Shield</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="popup">
  <header class="bar">
    <div class="brand">
      <img src="icons/icon32.png" alt="" width="22" height="22">
      <span>AENV Shield</span>
    </div>
    <div class="bar-actions">
      <label class="lang" data-i18n-title="language">
        <span aria-hidden="true">🌐</span>
        <select id="lang"></select>
      </label>
      <button id="openSettings" class="icon-btn" data-i18n-title="settings">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h9M19 7h1M4 17h3M13 17h7"/><circle cx="16" cy="7" r="2.5"/><circle cx="10" cy="17" r="2.5"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section class="hero" id="hero" data-status="off">
      <button id="power" class="power" data-i18n-title="connect">
        <svg viewBox="0 0 24 24" width="44" height="44" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M12 3v8M6.3 6.6a8 8 0 1 0 11.4 0"/></svg>
      </button>
      <div class="status" id="status" role="status" aria-live="polite"></div>
      <div class="ip" id="ip"></div>
    </section>

    <section class="card" id="serverCard">
      <label class="field-label" for="server" data-i18n="selectServer"></label>
      <div class="select-wrap">
        <select id="server"></select>
      </div>
      <div class="empty" id="empty" hidden>
        <p data-i18n="noServer"></p>
        <button id="addServer" class="btn-primary" data-i18n="addServer"></button>
      </div>
    </section>

    <section class="card toggles">
      <div class="toggle-row">
        <div>
          <div class="t-title" data-i18n="adBlocker"></div>
          <div class="t-desc" id="blocked" data-i18n="adBlockerDesc"></div>
        </div>
        <label class="switch"><input type="checkbox" id="adblock"><span></span><b class="sr" data-i18n="adBlocker"></b></label>
      </div>
      <button id="pauseSite" class="link-btn" hidden></button>
      <div class="toggle-row">
        <div>
          <div class="t-title" data-i18n="webrtc"></div>
          <div class="t-desc" data-i18n="webrtcDesc"></div>
        </div>
        <label class="switch"><input type="checkbox" id="webrtc"><span></span><b class="sr" data-i18n="webrtc"></b></label>
      </div>
      <div class="toggle-row">
        <div>
          <div class="t-title" data-i18n="killSwitch"></div>
          <div class="t-desc" data-i18n="killSwitchDesc"></div>
        </div>
        <label class="switch"><input type="checkbox" id="killSwitch"><span></span><b class="sr" data-i18n="killSwitch"></b></label>
      </div>
    </section>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
